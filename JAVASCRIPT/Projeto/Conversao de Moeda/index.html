<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Conversor de Moedas</title>
</head>
<body>
    <img class="logo" src="./assets/logo.gif" alt="logo-principal">
    <main>
        <label>
            Converter <b>de</b>
            <select class="currency-select-converter">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ - Dólar Americano</option>
                <option value="euro">€ - Euro</option>
                <option value="libra">£ - Libra</option>
                <option value="bitcoin">Ƀ - BitCoin</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ - Dólar Americano</option>
                <option value="euro">€ - Euro</option>
                <option value="libra">£ - Libra</option>
                <option value="bitcoin">Ƀ - BitCoin</option>
            </select>
        </label>

        <label>
            Valor
            <input class="inputCurrency" type="text" placeholder="R$0,00">
        </label>
   
        <button class="convertButton">Converter</button>

        <section>
            <div class="currency-box">
                <img class="currency-img1" src="./assets/brasil.png" alt="logo-moeda-a-converter">
                <p class="currency" id="currency-name1">Real</p>
                <p class="currency-value-to-convert">R$0</p>
            </div>
            <img class="arrow" src="./assets/seta.png" alt="seta">
            <div class="currency-box">
                <img class="currency-img2" src="./assets/dolar.png" alt="logo-moeda-convertida">
                <p class="currency" id="currency-name2">Dolar</p>
                <p class="currency-value">U$0</p>
            </div>
        </section>
    </main>
     
</body>
</html>
